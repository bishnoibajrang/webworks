<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Slideshow Prototype</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  
  <h1>Image Slideshow Application</h1>

  <!-- Step 1: Select images -->
  <input type="file" id="fileInput" accept="image/*" multiple>

  <!-- Step 2: Show thumbnails -->
  <h2>Image Table</h2>
  <div id="imageTable"></div>

  <!-- Step 3: Finalize selection -->
  <button id="finalizeBtn">Finalize Selection</button>

  <!-- Step 4: Reorder -->
  <h2>Selected Images (Reorder)</h2>
  <ul id="selectedList"></ul>

  <label>
      Slide Delay (ms):
      <input type="number" id="delayInput" value="2000" min="500">
  </label>
  <br><br>
  <button id="startSlideshowBtn">Start Slideshow</button>

  <!-- Step 5: Slideshow -->
  <div id="slideshow"></div>


  <script src="script.js"></script>
</body>
</html>
