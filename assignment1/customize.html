<!DOCTYPE html>
<html>
<head>
  <title>Customize</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Customize Layout</h2>
<a href="index.html">Back to Main</a>

<div class="control">
  <label>Button:</label>
  <select id="elementSelect">
    <option value="btn1">Button 1</option>
    <option value="btn2">Button 2</option>
  </select>
</div>

<div class="control">
  <label>Text:</label>
  <input id="textInput">
</div>

<div class="control">
  <label>X:</label>
  <input type="number" id="xInput">
  <label>Y:</label>
  <input type="number" id="yInput">
</div>

<div class="control">
  <label>Color:</label>
  <input type="color" id="colorInput">
</div>

<button id="apply">Apply</button>
<button id="save">Save Layout</button>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="common.js"></script>
<script>
  let layoutData = getLayout();

  function currentElement() {
    const id = $("#elementSelect").val();
    return layoutData.layout.find(e => e.id === id);
  }

  function loadFields() {
    const el = currentElement();
    $("#textInput").val(el.text);
    $("#xInput").val(el.x);
    $("#yInput").val(el.y);
    $("#colorInput").val(el.color);
  }

  $("#elementSelect").on("change", loadFields);

  $("#apply").on("click", function () {
    const el = currentElement();
    el.text = $("#textInput").val();
    el.x = Number($("#xInput").val());
    el.y = Number($("#yInput").val());
    el.color = $("#colorInput").val();
    alert("Applied (not saved)");
  });

  $("#save").on("click", function () {
    saveLayout(layoutData);
    alert("Layout saved");
  });

  loadFields();
</script>

</body>
</html>
